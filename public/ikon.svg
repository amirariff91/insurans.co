<svg xmlns="http://www.w3.org/2000/svg">
<!-- insurans.co icons, drawn from the logo. 13 Nov 2026. Original work for this project; no stock icons.
     Grid 24 by 24 with a 2 unit margin. One stroke, 2.25, round caps and joins, in currentColor.
     One knob in every icon: r 1.57, which is 1.4 times the stroke as in the logo, and never touching a stroke.
     Two CSS custom properties reach inside (written here without their two leading hyphens, which an XML
     comment may not hold): icon-knob, the knob colour, default #D0106F; icon-stroke, the line weight, default 2.25.
     Use: <svg class="ix-i" aria-hidden="true"><use href="icons.svg#i-kereta"/></svg>
     Source: the redesign worktree, docs/eeat-revamp-2026-11/round4/icons/icons.svg (copied via the Edisi concept's ikon.svg).
     No generator for this sprite exists in this repository: edit this file by hand, keeping the grid and knob rules above. -->
